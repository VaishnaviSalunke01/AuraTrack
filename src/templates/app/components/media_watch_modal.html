{% load static %}
<div class="bg-[#1a1d21] rounded-xl shadow-2xl max-w-md w-full mx-4 border border-gray-700 pointer-events-auto animate-in fade-in zoom-in duration-200">
  <div class="p-6">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-bold text-white flex items-center gap-2">
        🍿 Watch & Explore
      </h3>
      <button class="text-gray-400 hover:text-white transition-colors cursor-pointer p-1"
              onclick="document.getElementById('modal-container').innerHTML = ''">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="space-y-3">
      {% if result.providers %}
        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Streaming Subscriptions</p>
        {% for provider in result.providers %}
          <a href="{{ provider.url|default:'#' }}"
             target="_blank" rel="noopener noreferrer"
             class="flex items-center p-3 bg-[#2a2f35] rounded-lg hover:bg-[#343a40] transition-all border border-gray-700/50 group">
            <img src="{{ provider.logo }}" alt="{{ provider.name }}" class="w-8 h-8 mr-3 rounded shadow-sm">
            <div class="flex-1">
              <div class="text-white font-semibold text-sm group-hover:text-purple-400 transition-colors">{{ provider.name }}</div>
              <div class="text-gray-400 text-[10px]">Official Stream</div>
            </div>
            <svg class="w-4 h-4 text-gray-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>
          </a>
        {% endfor %}
      {% endif %}

      <div class="pt-4">
        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Free Resources & Search</p>
        
        <a href="https://www.youtube.com/results?search_query={{ title|urlencode }}+official+trailer"
           target="_blank" rel="noopener noreferrer"
           class="flex items-center p-3 bg-[#2a2f35] rounded-lg hover:bg-red-900/20 transition-all border border-gray-700/50 group mb-2">
          <div class="w-8 h-8 mr-3 bg-red-600 rounded flex items-center justify-center text-white">
             <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </div>
          <div class="flex-1">
            <div class="text-white font-semibold text-sm group-hover:text-red-500">YouTube Free</div>
            <div class="text-gray-400 text-[10px]">Trailers & Clips</div>
          </div>
        </a>

        <a href="https://www.google.com/search?q=watch+{{ title|urlencode }}+online+free"
           target="_blank" rel="noopener noreferrer"
           class="flex items-center p-3 bg-[#2a2f35] rounded-lg hover:bg-blue-900/20 transition-all border border-gray-700/50 group">
          <div class="w-8 h-8 mr-3 bg-white rounded flex items-center justify-center">
             <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92V8.51h7.73c.15.53.24 1.1.24 1.81 0 4.63-3.1 7.92-7.73 7.92-4.41 0-8-3.59-8-8s3.59-8 8-8c2.16 0 3.97.8 5.35 2.09l-3.04 2.92c-.88-.83-2.12-1.35-3.69-1.35-2.69 0-4.88 2.23-4.88 4.98s2.19 4.98 4.88 4.98c3.12 0 4.29-2.24 4.47-3.4h-4.47z"/></svg>
          </div>
          <div class="flex-1">
            <div class="text-white font-semibold text-sm group-hover:text-blue-400">Google Search</div>
            <div class="text-gray-400 text-[10px]">Find other free mirrors</div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
