<div x-data="{ chatOpen: false }" class="fixed flex flex-col items-end" style="position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;">
  
  <!-- Chat Window -->
  <div x-show="chatOpen" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-4 scale-95"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-4 scale-95"
       class="mb-4 bg-[#1a1d21] border border-gray-700 rounded-xl shadow-2xl flex flex-col overflow-hidden resize"
       style="width: 350px; height: 450px; min-width: 250px; min-height: 250px; max-width: 90vw; max-height: 80vh; display: none;">
    
    <!-- Header -->
    <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md">
      <h3 class="font-bold flex items-center gap-2 tracking-wide uppercase text-sm">
        ASK anything to ME
      </h3>
      <button @click="chatOpen = false" class="hover:text-gray-300 transition-colors cursor-pointer" title="Close AI">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Input Area (Directly below headline) -->
    <div class="p-4 bg-[#2a2f35] border-b border-gray-700 shadow-sm z-10">
      <form hx-post="{% url 'chatbot_message' %}" 
            hx-target="#chat-messages" 
            hx-swap="beforeend"
            hx-indicator="#chat-loading"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            @submit="setTimeout(() => $el.reset(), 10)"
            class="flex gap-2 relative">
        {% csrf_token %}
        <!-- Context injection: let the server know where the user is -->
        <input type="hidden" name="current_path" value="{{ request.path }}">
        
        <input type="text" name="message" placeholder="Ask anything..." autocomplete="off" required
               class="flex-1 bg-[#39404b] text-white placeholder-gray-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-600 w-full shadow-inner">
        
        <button type="submit" class="bg-indigo-600 text-white px-4 rounded-lg hover:bg-indigo-500 transition-colors cursor-pointer flex items-center justify-center shadow-md hover:scale-105">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        </button>
      </form>
    </div>

    <!-- Chat Response Area -->
    <div class="flex-1 p-4 overflow-y-auto bg-[#1a1d21] relative flex flex-col"
         @htmx:after-settle="$el.scrollTop = $el.scrollHeight">
       
       <div id="chat-messages" class="space-y-4 flex-1">
           <!-- HTMX will append new messages & responses here -->
       </div>

       <!-- Loading Indicator -->
       <div id="chat-loading" class="htmx-indicator flex justify-start mt-4">
           <div class="bg-[#39404b] text-gray-300 p-3 rounded-lg rounded-tl-none text-sm shadow-md animate-pulse flex items-center gap-2">
               <svg class="animate-spin h-4 w-4 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
               Thinking...
           </div>
       </div>
    </div>
  </div>

  <!-- Chat Toggle Button (Robot Icon + Ask AI Label) -->
  <button @click="chatOpen = !chatOpen" 
          class="group flex flex-col items-center justify-center bg-[#2a2f35] p-3 rounded-2xl shadow-xl hover:bg-[#343a40] hover:-translate-y-1 transition-all duration-300 border border-gray-600 cursor-pointer">
    <svg class="w-8 h-8 text-indigo-400 group-hover:text-indigo-300 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"></rect>
      <circle cx="12" cy="5" r="2"></circle>
      <path d="M12 7v4"></path>
      <line x1="8" y1="16" x2="8" y2="16"></line>
      <line x1="16" y1="16" x2="16" y2="16"></line>
    </svg>
    <span class="text-[10px] font-extrabold text-gray-300 mt-1 uppercase tracking-widest">Ask AI</span>
  </button>

</div>
